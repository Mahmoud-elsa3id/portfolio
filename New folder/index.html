<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Slider</title>

    <!-- Icons (Devicon: official technology icons) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/devicon.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="tech-section" id="skills">
      <div class="tech-section__header">
        <h2>Tech Stack</h2>
        <p>Tools and technologies I use to build modern web experiences.</p>
      </div>

      <div class="tech-slider" role="region" aria-label="Technology skills">
        <!-- The groups of cards are generated by script.js -->
        <div class="tech-slider__track" id="techTrack"></div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
